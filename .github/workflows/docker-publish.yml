name: Build and Publish Docker Image

# Gated on the "Security Scan" workflow (Trivy) having completed successfully
# on main — this doesn't build/push unless that scan passed first.
on:
  workflow_run:
    workflows: ["Security Scan"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/startup-funding-rag

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      packages: write
    steps:
      # workflow_run's own `github.sha` context is the default branch's HEAD at
      # trigger time, not necessarily the commit that was actually scanned —
      # resolve the real commit once here and reuse it for both checkout and
      # the image tag/label below so what gets built always matches what Trivy
      # scanned.
      - name: Resolve commit SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.short_sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: impl
          file: impl/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
